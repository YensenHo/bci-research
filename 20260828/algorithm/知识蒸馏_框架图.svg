<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="620" fill="#0d1117"/>
  <text x="480" y="42" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">知识蒸馏框架 · 端侧小模型受益于软标签</text>
  <text x="480" y="66" text-anchor="middle" fill="#8b949e" font-size="13">大模型软标签 → 小模型（可类脑化）→ 端侧芯片逐位一致</text>

  <!-- 三个主节点 -->
  <g>
    <rect x="50" y="110" width="240" height="130" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="170" y="142" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">Teacher 大模型</text>
    <text x="170" y="168" text-anchor="middle" fill="#e6edf3" font-size="13">ELU EEG-TCNet</text>
    <text x="170" y="190" text-anchor="middle" fill="#8b949e" font-size="12">35,180 参数 · 满标签训练</text>
    <text x="170" y="210" text-anchor="middle" fill="#8b949e" font-size="12">eval 65.7%（22ch 四分类）</text>
    <text x="170" y="230" text-anchor="middle" fill="#3fb950" font-size="12">软标签 softmax(z/T)，T=4.0</text>
  </g>

  <g>
    <rect x="360" y="110" width="240" height="130" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="480" y="142" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">Student 小模型</text>
    <text x="480" y="168" text-anchor="middle" fill="#e6edf3" font-size="13">LIF / relu EEG-TCNet</text>
    <text x="480" y="190" text-anchor="middle" fill="#8b949e" font-size="12">9,512 参数（brief）</text>
    <text x="480" y="210" text-anchor="middle" fill="#8b949e" font-size="12">LIF 热启动 56.40%</text>
    <text x="480" y="230" text-anchor="middle" fill="#d29922" font-size="12">loss = α·T²·KL + (1−α)·CE</text>
  </g>

  <g>
    <rect x="670" y="110" width="240" height="130" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="790" y="142" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">端侧芯片</text>
    <text x="790" y="168" text-anchor="middle" fill="#e6edf3" font-size="13">RV1106（¥338）</text>
    <text x="790" y="190" text-anchor="middle" fill="#8b949e" font-size="12">BN 折叠 + 导出 C</text>
    <text x="790" y="210" text-anchor="middle" fill="#8b949e" font-size="12">9344 参数</text>
    <text x="790" y="230" text-anchor="middle" fill="#3fb950" font-size="12">逐位一致 · 0 误差</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M290 175 L360 175" marker-end="url(#arr)"/>
    <path d="M600 175 L670 175" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 三条规律 -->
  <text x="50" y="300" fill="#e6edf3" font-size="16" font-weight="700">三条规律（双 seed 复现）</text>
  <g>
    <rect x="50" y="320" width="276" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="188" y="348" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">① 红利集中低标签</text>
    <text x="188" y="372" text-anchor="middle" fill="#e6edf3" font-size="12">满标注 ≈ 0（中性）</text>
    <text x="188" y="394" text-anchor="middle" fill="#3fb950" font-size="13">30% 标注 +5~7pp</text>
    <text x="188" y="416" text-anchor="middle" fill="#8b949e" font-size="11">10% 标注 +3~5pp</text>
  </g>
  <g>
    <rect x="342" y="320" width="276" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="480" y="348" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">② 红利随任务难度增大</text>
    <text x="480" y="372" text-anchor="middle" fill="#e6edf3" font-size="12">22ch 四分类（基线 48%）</text>
    <text x="480" y="394" text-anchor="middle" fill="#3fb950" font-size="13">+7.00pp</text>
    <text x="480" y="416" text-anchor="middle" fill="#8b949e" font-size="11">8ch 二分类（基线 69%）+5.02pp</text>
  </g>
  <g>
    <rect x="634" y="320" width="276" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="772" y="348" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">③ 类脑化零代价</text>
    <text x="772" y="372" text-anchor="middle" fill="#e6edf3" font-size="12">LIF 热启动 56.40%</text>
    <text x="772" y="394" text-anchor="middle" fill="#3fb950" font-size="13">追平 relu 57.25%（−0.85pp）</text>
    <text x="772" y="416" text-anchor="middle" fill="#8b949e" font-size="11">随机初始化则 49%（需热启动）</text>
  </g>

  <!-- 端侧闭环 -->
  <text x="50" y="480" fill="#e6edf3" font-size="16" font-weight="700">端侧闭环链路</text>
  <rect x="50" y="498" width="860" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="527" text-anchor="middle" fill="#e6edf3" font-size="13">蒸馏训练 → 保存 checkpoint → BN 折叠 → 导出 C 头 → 端侧 C 推理逐位验证（8ch 1650 参数 · 4 类 9344 参数 · 均 0 误差）</text>

  <text x="480" y="580" text-anchor="middle" fill="#8b949e" font-size="12">核心：蒸馏训出的模型直接走既有端侧 C 链路，无需改结构 → 训练端蒸馏与部署端类脑化无缝衔接</text>
</svg>
